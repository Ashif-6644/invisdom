<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>INVISDOM AI — Discover your food personality</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20211f;background:#f8f7f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.wrap{width:min(100%,570px)}.brand{font-size:14px;font-weight:800;letter-spacing:.03em;color:#34775e;margin-bottom:18px}.panel{background:white;padding:clamp(24px,6vw,40px);border:1px solid #e9e9df;border-radius:24px;box-shadow:0 18px 55px #1f2a1710}h1{font-size:clamp(29px,6vw,43px);letter-spacing:-.045em;line-height:1.12;margin:9px 0 14px}.muted{color:#6f756d;line-height:1.6}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;color:#367b61;text-transform:uppercase}.btn,.option{cursor:pointer;border:0;font:inherit}.btn{background:#246448;color:white;border-radius:14px;padding:15px 23px;font-weight:700;margin-top:24px;width:100%}.btn.secondary{background:#eaf3ed;color:#20583e;margin-top:10px}.option{display:block;text-align:left;width:100%;background:#f7f8f5;border:1px solid #e7ebe5;padding:15px 17px;border-radius:14px;margin:10px 0;font-weight:550;color:#2d332e}.option:hover,.option:focus{background:#e8f5ed;border-color:#80b394}.progress{height:7px;background:#e9efea;border-radius:10px;overflow:hidden;margin:17px 0 30px}.fill{height:100%;background:#368b62;transition:width .25s}.score{font-size:15px;color:#607365;font-weight:650}.result{background:#edf6ee;border-radius:17px;padding:20px;margin-top:25px}.result h2{margin:6px 0}.foot{font-size:12px;color:#868d86;text-align:center;line-height:1.6;padding:20px 12px}button:focus-visible{outline:3px solid #69b38c;outline-offset:3px}</style></head><body><main class="wrap"><div class="brand">✦ INVISDOM AI</div><section id="app" class="panel" aria-live="polite"></section><div class="foot">Created by Mohamed Ashif · @invisible_startdom<br>A playful food-choice experience, not medical or nutritional advice. No answers are stored or sent anywhere.</div></main><script>
const questions=[
{q:'You have 15 minutes for lunch. What do you choose?',a:['Try somewhere new','Grab my usual favorite','Find something balanced','Pick what is quickest']},
{q:'You spot an unfamiliar dish on a menu.',a:['Order it immediately','Stay with something I know','Check the ingredients first','Decide based on my mood']},
{q:'Your afternoon gets unexpectedly busy.',a:['Discover a new quick bite','Reach for my comfort snack','Pause and plan my next meal','Eat when I get a chance']},
{q:'A friend suggests a weekend food outing.',a:['New cuisine, definitely!','My favorite restaurant','A place with plenty of choices','Anywhere that fits our plans']},
{q:'Which food-shopping style sounds most like you?',a:['I love discovering new items','I buy trusted favorites','I make a list first','I improvise as I go']},
{q:'Someone brings a surprise dessert.',a:['Excited to taste it','Hope it is my favorite','Have some if I feel like it','See what everyone else does']},
{q:'How do you decide what to cook?',a:['Experiment with a recipe','Make a familiar meal','Consider what I have and need','Create something on the spot']},
{q:'What sounds most enjoyable at a food market?',a:['Sampling unusual flavors','Finding old favorites','Exploring fresh options','Following whatever catches my eye']}
];
const profiles=[{name:'The Flavor Explorer',emoji:'🌍',desc:'You are drawn to novelty and discovery. Trying new flavors is part of the fun.'},{name:'The Comfort Curator',emoji:'💛',desc:'Familiar favorites matter to you. You know which foods make an occasion feel special.'},{name:'The Thoughtful Chooser',emoji:'🌱',desc:'You like to pause, consider options, and make intentional food choices.'},{name:'The Spontaneous Foodie',emoji:'⚡',desc:'You are flexible and resourceful. Your food decisions adapt to the moment.'}];
let step=-1, answers=[];const el=document.getElementById('app');
function render(){if(step===-1){el.innerHTML='<div class="eyebrow">A 2-minute food game</div><h1>What’s your food personality?</h1><p class="muted">Your everyday choices might reveal a fun pattern. Answer 8 mini-scenarios, discover your food style, and challenge a friend.</p><button class="btn" id="start">Start the challenge →</button>';document.getElementById('start').onclick=()=>{step=0;render()};return}
if(step<questions.length){const item=questions[step];el.innerHTML='<div class="eyebrow">Question '+(step+1)+' of '+questions.length+'</div><div class="progress"><div class="fill" style="width:'+100*step/questions.length+'%"></div></div><h1>'+item.q+'</h1><div id="choices"></div><p class="muted score">No right or wrong answers.</p>';const choices=document.getElementById('choices');item.a.forEach((a,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+a;b.onclick=()=>{answers.push(i);step++;render()};choices.appendChild(b)});return}
const scores=[0,0,0,0];answers.forEach(i=>scores[i]++);const top=scores.indexOf(Math.max(...scores));const p=profiles[top];el.innerHTML='<div class="eyebrow">Your INVISDOM result</div><h1>'+p.emoji+' '+p.name+'</h1><p class="muted">'+p.desc+'</p><div class="result"><h2>Your mini food challenge</h2><p>Try one food choice outside your usual routine this week, and notice what you enjoy about it.</p></div><button class="btn" id="share">Share my result ↗</button><button class="btn secondary" id="again">Play again</button>';document.getElementById('again').onclick=()=>{answers=[];step=-1;render()};document.getElementById('share').onclick=async()=>{const url=location.protocol.startsWith('http')?location.href:'';const text='I tried INVISDOM AI and got “'+p.name+'” '+p.emoji+'! What is your food personality?'+(url?' '+url:'');try{if(navigator.share){await navigator.share({title:'INVISDOM AI food personality',text})}else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('Result copied!')}else prompt('Copy your result:',text)}catch(e){if(e.name!=='AbortError')prompt('Copy your result:',text)}}}
render();
</script></body></html>
